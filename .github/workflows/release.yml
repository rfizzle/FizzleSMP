name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go (for packwiz CLI)
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz CLI
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify pack.toml version matches tag
        run: |
          PACK_VERSION=$(awk -F' = ' '/^version = / { gsub(/"/, "", $2); print $2; exit }' modpack/pack.toml)
          if [[ "$PACK_VERSION" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::pack.toml version ($PACK_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            echo "Run scripts/release.sh to cut releases — do not tag manually."
            exit 1
          fi

      - name: Build client pack (CurseForge export)
        run: ./scripts/build-pack.sh client

      - name: Build Modrinth pack (.mrpack)
        run: |
          cd modpack
          packwiz modrinth export --side client \
            -o "$GITHUB_WORKSPACE/FizzleSMP-client-${{ steps.version.outputs.version }}.mrpack"

      - name: Cache server pack downloads
        uses: actions/cache@v4
        with:
          path: |
            build/server/mods
            build/server/config/paxi/datapacks
            build/server/shaderpacks
          key: server-pack-${{ hashFiles('modpack/mods/*.pw.toml', 'modpack/config/paxi/datapacks/*.pw.toml', 'modpack/shaderpacks/*.pw.toml') }}
          restore-keys: |
            server-pack-

      - name: Build server pack (drop-in directory)
        run: ./scripts/build-pack.sh server

      - name: List build artifacts
        run: ls -lh FizzleSMP-*

      - name: Extract changelog section for this release
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BODY=$(awk -v ver="$VERSION" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\["ver"\\]") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md)

          if [[ -z "$BODY" ]]; then
            BODY="See CHANGELOG.md for details."
          fi

          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "$BODY" > /tmp/release-body.md

      - name: Detect existing release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
               --json isDraft --jq '.isDraft' > /tmp/rel-draft.txt 2>/dev/null \
             && [ "$(cat /tmp/rel-draft.txt)" = "false" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Published release $GITHUB_REF_NAME already exists; skipping GitHub release steps"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft GitHub Release
        if: steps.rel.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FizzleSMP ${{ steps.version.outputs.tag }}
          body: |
            ${{ steps.changelog.outputs.body }}

            ## Install / update the server

            ```bash
            ./server-install.sh ${{ steps.version.outputs.tag }}
            ```

            See [`docs/server-deployment.md`](https://github.com/rfizzle/FizzleSMP/blob/${{ steps.version.outputs.tag }}/docs/server-deployment.md) for the full guide.
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            FizzleSMP-client-${{ steps.version.outputs.version }}.zip
            FizzleSMP-client-${{ steps.version.outputs.version }}.mrpack
            FizzleSMP-server-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true

      - name: Publish GitHub Release
        if: steps.rel.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Detect publish auth
        id: publish
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [ -n "$MODRINTH_TOKEN" ] || [ -n "$CURSEFORGE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No MODRINTH_TOKEN/CURSEFORGE_TOKEN; skipping platform publish"
          fi

      - name: Set up Python
        if: steps.publish.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish to Modrinth and CurseForge
        if: steps.publish.outputs.available == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: B3409rxs
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_ID: "1511791"
          VERSION: ${{ steps.version.outputs.version }}
          TITLE: "FizzleSMP ${{ steps.version.outputs.tag }}"
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          GAME_VERSIONS: "1.21.1"
          LOADERS: "fabric"
          CLIENT_ZIP: FizzleSMP-${{ steps.version.outputs.version }}.zip
          CLIENT_MRPACK: FizzleSMP-${{ steps.version.outputs.version }}.mrpack
          SERVER_ZIP: FizzleSMP-server-${{ steps.version.outputs.version }}.zip
          CHANGELOG_FILE: /tmp/release-body.md
        run: |
          python3 -m pip install --quiet 'requests>=2.31,<3'
          python3 scripts/release/publish.py
