name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go (for packwiz CLI)
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz CLI
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify pack.toml version matches tag
        run: |
          PACK_VERSION=$(awk -F' = ' '/^version = / { gsub(/"/, "", $2); print $2; exit }' modpack/pack.toml)
          if [[ "$PACK_VERSION" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::pack.toml version ($PACK_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            echo "Run scripts/release.sh to cut releases — do not tag manually."
            exit 1
          fi

      - name: Build client pack (CurseForge export)
        run: ./scripts/build-pack.sh client

      - name: Build Modrinth pack (.mrpack)
        run: |
          mkdir -p build
          cd modpack
          packwiz modrinth export --side client \
            -o "$GITHUB_WORKSPACE/build/FizzleSMP-${{ steps.version.outputs.version }}.mrpack"

      - name: Cache server pack downloads
        uses: actions/cache@v4
        with:
          path: |
            build/server/mods
            build/server/config/paxi/datapacks
            build/server/shaderpacks
          key: server-pack-${{ hashFiles('modpack/mods/*.pw.toml', 'modpack/config/paxi/datapacks/*.pw.toml', 'modpack/shaderpacks/*.pw.toml') }}
          restore-keys: |
            server-pack-

      - name: Build server pack (drop-in directory)
        run: ./scripts/build-pack.sh server

      - name: List build artifacts
        run: ls -lh build/FizzleSMP-*

      # --- Release notes pipeline ---
      # Priority: hand-written changelogs/<version>.md > AI-generated > commit log

      - name: Cache release notes
        id: notescache
        uses: actions/cache@v4
        with:
          path: /tmp/release-body.md
          key: release-notes-${{ github.ref_name }}

      - name: Detect manual changelog
        id: manual
        if: steps.notescache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -s "changelogs/${VERSION}.md" ]; then
            cp "changelogs/${VERSION}.md" /tmp/manual-notes.md
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Using hand-written changelogs/${VERSION}.md"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No changelogs/${VERSION}.md; generating release notes"
          fi

      - name: Gather changelog source
        if: steps.notescache.outputs.cache-hit != 'true' && steps.manual.outputs.present != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" --jq '.body' \
              > /tmp/gh-notes.md 2>/tmp/gh-notes-err.txt; then
            echo "Gathered $(wc -l < /tmp/gh-notes.md) line(s) of source notes"
          else
            echo "::warning::Could not generate source notes"
            tail -c 500 /tmp/gh-notes-err.txt || true
            : > /tmp/gh-notes.md
          fi

      - name: Detect Claude auth
        id: auth
        if: steps.notescache.outputs.cache-hit != 'true' && steps.manual.outputs.present != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN; using raw changelog"
          fi

      - name: Install Claude Code
        if: steps.notescache.outputs.cache-hit != 'true' && steps.auth.outputs.available == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh -o /tmp/claude-install.sh
          echo "claude install.sh sha256: $(sha256sum /tmp/claude-install.sh | cut -d' ' -f1)"
          bash /tmp/claude-install.sh

      - name: Write release notes
        if: steps.notescache.outputs.cache-hit != 'true' && steps.auth.outputs.available == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            cat <<EOF
          You are writing the public release notes for "FizzleSMP" v${VERSION}, a
          curated Minecraft 1.21.1 Fabric modpack.

          Rewrite the merged commits / pull requests below into concise, friendly,
          player-facing release notes:
          - Open with one or two sentences on what this release is about.
          - Then group changes under "## Added", "## Changed", "## Fixed", and
            "## Removed". Omit any section that would be empty.
          - Write for players, not developers: no commit hashes, PR numbers,
            author handles, branch names, or internal/CI/build jargon.
          - Describe ONLY changes present in the list below — never invent, infer,
            or embellish features.
          - Keep it tight: a handful of bullets per section at most.
          Output only the Markdown release notes, with no preamble or sign-off.

          --- BEGIN SOURCE ---
          EOF
            cat /tmp/gh-notes.md
            cat <<'EOF'
          --- END SOURCE ---
          EOF
          } > /tmp/changelog-prompt.txt

          RESULT="$(~/.local/bin/claude -p \
            --output-format json \
            --model sonnet \
            --max-turns 2 \
            --max-budget-usd 0.50 \
            < /tmp/changelog-prompt.txt 2>/tmp/changelog-stderr.txt)" || true

          NOTES="$(printf '%s' "$RESULT" | jq -r '.result // empty' 2>/dev/null)" || true
          COST="$(printf '%s' "$RESULT" | jq -r '.total_cost_usd // 0' 2>/dev/null)" || COST=0

          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > /tmp/ai-notes.md
            echo "Wrote release notes (\$${COST})"
          else
            echo "::warning::Release-note model produced no output; falling back to raw notes"
            tail -c 1000 /tmp/changelog-stderr.txt || true
          fi

      - name: Assemble release body
        if: steps.notescache.outputs.cache-hit != 'true'
        run: |
          if [ -s /tmp/manual-notes.md ]; then
            cp /tmp/manual-notes.md /tmp/release-body.md
          elif [ -s /tmp/ai-notes.md ]; then
            cp /tmp/ai-notes.md /tmp/release-body.md
          elif [ -s /tmp/gh-notes.md ]; then
            cp /tmp/gh-notes.md /tmp/release-body.md
          else
            echo "FizzleSMP v${{ steps.version.outputs.version }}" > /tmp/release-body.md
          fi
          echo "--- release body ---"
          cat /tmp/release-body.md

      - name: Detect existing release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
               --json isDraft --jq '.isDraft' > /tmp/rel-draft.txt 2>/dev/null \
             && [ "$(cat /tmp/rel-draft.txt)" = "false" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Published release $GITHUB_REF_NAME already exists; skipping GitHub release steps"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft GitHub Release
        if: steps.rel.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FizzleSMP ${{ steps.version.outputs.tag }}
          body_path: /tmp/release-body.md
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            build/FizzleSMP-${{ steps.version.outputs.version }}.zip
            build/FizzleSMP-${{ steps.version.outputs.version }}.mrpack
            build/FizzleSMP-server-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true

      - name: Publish GitHub Release
        if: steps.rel.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Detect publish auth
        id: publish
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [ -n "$MODRINTH_TOKEN" ] || [ -n "$CURSEFORGE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No MODRINTH_TOKEN/CURSEFORGE_TOKEN; skipping platform publish"
          fi

      - name: Set up Python
        if: steps.publish.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish to Modrinth and CurseForge
        if: steps.publish.outputs.available == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: B3409rxs
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_ID: "1511791"
          VERSION: ${{ steps.version.outputs.version }}
          TITLE: "FizzleSMP ${{ steps.version.outputs.tag }}"
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          GAME_VERSIONS: "1.21.1"
          LOADERS: "fabric"
          CLIENT_ZIP: build/FizzleSMP-${{ steps.version.outputs.version }}.zip
          CLIENT_MRPACK: build/FizzleSMP-${{ steps.version.outputs.version }}.mrpack
          SERVER_ZIP: build/FizzleSMP-server-${{ steps.version.outputs.version }}.zip
          CHANGELOG_FILE: /tmp/release-body.md
        run: |
          python3 -m pip install --quiet 'requests>=2.31,<3'
          python3 scripts/release/publish.py
